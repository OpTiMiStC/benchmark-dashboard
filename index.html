<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Benchmark Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1120;
        --bg-accent: radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 35%),
          linear-gradient(180deg, #111827 0%, #020617 100%);
        --panel: rgba(15, 23, 42, 0.88);
        --panel-border: rgba(148, 163, 184, 0.18);
        --text: #e5eefb;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent-strong: #3b82f6;
        --input-bg: rgba(15, 23, 42, 0.95);
        --table-header: rgba(30, 41, 59, 0.95);
        --table-row: rgba(15, 23, 42, 0.7);
        --table-row-alt: rgba(30, 41, 59, 0.45);
        --shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: #020617;
      }

      body {
        font-family: Inter, Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: var(--bg-accent);
        color: var(--text);
      }

      #root {
        padding: 3rem 1.5rem;
      }

      .app-shell {
        max-width: 1100px;
        margin: 0 auto;
      }

      .hero-card,
      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .hero-card {
        padding: 2rem;
        margin-bottom: 1.5rem;
      }

      .hero-card h1 {
        margin: 0.35rem 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .hero-card p,
      .results-count {
        color: var(--muted);
      }

      .eyebrow {
        display: inline-block;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.14);
        color: #bfdbfe;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .panel {
        padding: 1.5rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .controls > * {
        flex: 1 1 280px;
        min-height: 3.5rem;
      }

      .controls input[type="text"] {
        max-width: 460px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        overflow: hidden;
        border-radius: 16px;
      }

      th, td {
        padding: 0.95rem 1rem;
        text-align: left;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }

      th {
        background: var(--table-header);
        color: #bfdbfe;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .sort-button {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 700;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
      }

      .sort-button:hover {
        color: #dbeafe;
      }

      .benchmark-link {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #93c5fd;
        font: inherit;
        text-align: left;
        cursor: pointer;
        box-shadow: none;
      }

      .benchmark-link:hover,
      .benchmark-link:focus {
        color: #dbeafe;
        text-decoration: underline;
        box-shadow: none;
      }

      tbody tr {
        background: var(--table-row);
      }

      tbody tr:nth-child(even) {
        background: var(--table-row-alt);
      }

      tbody tr:hover {
        background: rgba(59, 130, 246, 0.12);
      }

      input, select, button {
        padding: 1rem 1.1rem;
        border-radius: 12px;
        border: 1px solid rgba(96, 165, 250, 0.18);
        background: var(--input-bg);
        color: var(--text);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input::placeholder {
        color: #64748b;
      }

      input:focus,
      select:focus,
      button:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
      }

      .table-wrap {
        overflow-x: auto;
        border-radius: 16px;
      }

      .details-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: rgba(2, 6, 23, 0.78);
      }

      .details-modal {
        width: min(960px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        padding: 1.5rem;
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.98);
        box-shadow: var(--shadow);
      }

      .details-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      .details-header h2 {
        margin: 0.35rem 0 0.5rem;
        font-size: clamp(1.6rem, 3vw, 2.3rem);
      }

      .details-header p,
      .detail-footnote {
        color: var(--muted);
      }

      .details-close {
        white-space: nowrap;
        background: rgba(30, 41, 59, 0.95);
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .detail-card,
      .detail-section {
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 16px;
        background: rgba(30, 41, 59, 0.5);
      }

      .detail-card {
        padding: 1rem;
      }

      .detail-label {
        display: block;
        margin-bottom: 0.45rem;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .detail-columns {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      .detail-section {
        padding: 1rem;
      }

      .detail-section h3 {
        margin: 0 0 0.9rem;
        font-size: 1rem;
      }

      .detail-list {
        display: grid;
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .detail-list li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
      }

      .detail-list span {
        color: var(--muted);
      }

      @media (max-width: 640px) {
        #root {
          padding: 1rem;
        }

        .hero-card,
        .panel {
          padding: 1rem;
          border-radius: 16px;
        }

        .controls > * {
          width: 100%;
        }

        .details-overlay {
          padding: 0.75rem;
        }

        .details-modal {
          padding: 1rem;
        }

        .details-header,
        .detail-columns,
        .detail-list li {
          grid-template-columns: 1fr;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script data-trunk src="Cargo.toml" type="rust"></script>
  </body>
</html>

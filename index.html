<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Benchmark Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1120;
        --bg-accent: radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 35%),
          linear-gradient(180deg, #111827 0%, #020617 100%);
        --panel: rgba(15, 23, 42, 0.88);
        --panel-border: rgba(148, 163, 184, 0.18);
        --text: #e5eefb;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent-strong: #3b82f6;
        --input-bg: rgba(15, 23, 42, 0.95);
        --table-header: rgba(30, 41, 59, 0.95);
        --table-row: rgba(15, 23, 42, 0.7);
        --table-row-alt: rgba(30, 41, 59, 0.45);
        --shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: #020617;
      }

      body {
        font-family: Inter, Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: var(--bg-accent);
        color: var(--text);
      }

      #root {
        padding: 3rem 1.5rem;
      }

      .app-shell {
        max-width: 1100px;
        margin: 0 auto;
      }

      .hero-card,
      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .hero-card {
        padding: 2rem;
        margin-bottom: 1.5rem;
      }

      .hero-card h1 {
        margin: 0.35rem 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .hero-card p,
      .results-count {
        color: var(--muted);
      }

      .eyebrow {
        display: inline-block;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.14);
        color: #bfdbfe;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .panel {
        padding: 1.5rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        overflow: hidden;
        border-radius: 16px;
      }

      th, td {
        padding: 0.95rem 1rem;
        text-align: left;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }

      th {
        background: var(--table-header);
        color: #bfdbfe;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      tbody tr {
        background: var(--table-row);
      }

      tbody tr:nth-child(even) {
        background: var(--table-row-alt);
      }

      tbody tr:hover {
        background: rgba(59, 130, 246, 0.12);
      }

      input, select, button {
        padding: 0.8rem 0.95rem;
        border-radius: 12px;
        border: 1px solid rgba(96, 165, 250, 0.18);
        background: var(--input-bg);
        color: var(--text);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input::placeholder {
        color: #64748b;
      }

      input:focus,
      select:focus,
      button:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
      }

      .table-wrap {
        overflow-x: auto;
        border-radius: 16px;
      }

      @media (max-width: 640px) {
        #root {
          padding: 1rem;
        }

        .hero-card,
        .panel {
          padding: 1rem;
          border-radius: 16px;
        }

        .controls > * {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script data-trunk src="Cargo.toml" type="rust"></script>
  </body>
</html>
